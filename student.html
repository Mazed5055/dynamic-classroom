<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>শিক্ষার্থী লগইন | Dynamic Classroom</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Hind Siliguri',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

.login-container{width:100%;max-width:420px}
.login-box{background:#fff;padding:36px 30px;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;animation:slideUp .5s}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

.login-logo{width:75px;height:75px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:#fff;font-size:2rem;box-shadow:0 8px 20px rgba(102,126,234,.4)}

.login-box h2{color:#1a365d;margin-bottom:6px;font-size:1.5rem}
.login-box p.sub{color:#64748b;font-size:.9rem;margin-bottom:26px}

.form-group{text-align:left;margin-bottom:16px}
.form-group label{display:block;margin-bottom:7px;color:#334155;font-weight:600;font-size:.9rem}
.form-group label i{color:#667eea;margin-right:6px}

.form-group input{width:100%;padding:13px 16px;border:2px solid #e2e8f0;border-radius:10px;font-family:inherit;font-size:1rem;transition:.25s;background:#f8fafc}
.form-group input:focus{outline:none;border-color:#667eea;background:#fff;box-shadow:0 0 0 4px rgba(102,126,234,.12)}

.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-weight:600;font-size:1.05rem;cursor:pointer;font-family:inherit;transition:.3s;margin-top:8px;box-shadow:0 6px 18px rgba(102,126,234,.35)}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(102,126,234,.45)}
.login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.login-btn i{margin-right:6px}

.message{padding:12px;border-radius:9px;font-size:.92rem;margin-bottom:18px;display:none;font-weight:500}
.message.error{background:#fee2e2;color:#b91c1c;display:block}
.message.success{background:#dcfce7;color:#166534;display:block}
.message.info{background:#dbeafe;color:#1e40af;display:block}

.login-footer{text-align:center;margin-top:22px;padding-top:18px;border-top:1px solid #e2e8f0}
.login-footer a{color:#667eea;text-decoration:none;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:6px}
.login-footer a:hover{text-decoration:underline}

/* Dashboard */
.dashboard{display:none;width:100%;max-width:900px}
.dashboard.active{display:block;animation:slideUp .5s}

.dash-header{background:#fff;padding:20px 26px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;box-shadow:0 8px 25px rgba(0,0,0,.12);flex-wrap:wrap;gap:12px}
.dash-header .info{display:flex;align-items:center;gap:14px}
.dash-header .avatar{width:52px;height:52px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.4rem;font-weight:700}
.dash-header h3{color:#1a365d;font-size:1.15rem}
.dash-header p{color:#64748b;font-size:.85rem}
.logout-btn{background:#ef4444;color:#fff;border:none;padding:10px 18px;border-radius:9px;font-family:inherit;font-weight:600;cursor:pointer;font-size:.9rem;transition:.2s}
.logout-btn:hover{background:#b91c1c}

.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.dash-card{background:#fff;padding:22px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.08);text-align:center}
.dash-card .icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:1.3rem;color:#fff}
.dash-card .icon.blue{background:linear-gradient(135deg,#3b82f6,#60a5fa)}
.dash-card .icon.green{background:linear-gradient(135deg,#10b981,#34d399)}
.dash-card .icon.orange{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.dash-card .icon.purple{background:linear-gradient(135deg,#8b5cf6,#a78bfa)}
.dash-card h3{color:#1a365d;font-size:1.5rem;margin-bottom:4px}
.dash-card p{color:#64748b;font-size:.88rem}

.dash-section{background:#fff;padding:22px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.08);margin-bottom:16px}
.dash-section h3{color:#1a365d;margin-bottom:14px;font-size:1.05rem;border-bottom:2px solid #f1f5f9;padding-bottom:10px}
.dash-section ul{list-style:none}
.dash-section li{padding:11px 0;border-bottom:1px solid #f1f5f9;color:#334155;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.dash-section li:last-child{border-bottom:none}
.dash-section li .badge{background:#dcfce7;color:#166534;padding:4px 12px;border-radius:50px;font-size:.78rem;font-weight:600}
.dash-section li .badge.pending{background:#fef3c7;color:#b45309}

/* Result */
.exam-block{text-align:left;margin-bottom:22px;background:#f8fafc;padding:14px;border-radius:10px;border:1px solid #e2e8f0}
.exam-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.exam-head h4{color:#1a365d;font-size:1rem;margin:0}
.exam-total{font-size:.85rem;color:#64748b}
.exam-table{width:100%;border-collapse:collapse;font-size:.85rem;background:#fff;border-radius:8px;overflow:hidden}
.exam-table th{background:#e2e8f0;color:#1a365d;padding:9px 8px;font-weight:600;font-size:.82rem}
.exam-table td{padding:9px 8px;border-bottom:1px solid #f1f5f9;color:#334155}
.exam-table tr:last-child td{border-bottom:none}
.exam-table .center{text-align:center}
.mini-badge{padding:2px 10px;border-radius:50px;font-weight:600;font-size:.78rem;display:inline-block}
.mini-pass{background:#dcfce7;color:#166534}
.mini-fail{background:#fee2e2;color:#b91c1c}
.mini-grade-pass{background:#dcfce7;color:#166534}
.mini-grade-fail{background:#fee2e2;color:#b91c1c}

@media(max-width:600px){
  .login-box{padding:28px 22px}
  .dash-header{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login-container" id="loginContainer">
  <div class="login-box">
    <div class="login-logo"><i class="fa-solid fa-user-graduate"></i></div>
    <h2>শিক্ষার্থী লগইন</h2>
    <p class="sub">Dynamic Classroom-এ স্বাগতম</p>

    <div class="message" id="msg"></div>

    <form onsubmit="studentLogin(event)">
      <div class="form-group">
        <label><i class="fa-solid fa-id-card"></i> শিক্ষার্থী আইডি</label>
        <input type="text" id="loginId" placeholder="যেমন: STU001" required autocomplete="off">
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-lock"></i> পাসওয়ার্ড</label>
        <input type="password" id="loginPass" placeholder="আপনার পাসওয়ার্ড" required>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        <i class="fa-solid fa-right-to-bracket"></i> লগইন করুন
      </button>
    </form>

    <div class="login-footer">
      <a href="index.html"><i class="fa-solid fa-arrow-left"></i> হোমে ফিরে যান</a>
    </div>
  </div>
</div>

<!-- ============ DASHBOARD ============ -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <div class="info">
      <div class="avatar" id="avatar">S</div>
      <div>
        <h3 id="dashName">শিক্ষার্থী</h3>
        <p id="dashInfo">লোড হচ্ছে...</p>
      </div>
    </div>
    <button class="logout-btn" onclick="studentLogout()">
      <i class="fa-solid fa-right-from-bracket"></i> লগআউট
    </button>
  </div>

  <div class="dash-grid">
    <div class="dash-card">
      <div class="icon blue"><i class="fa-solid fa-file-lines"></i></div>
      <h3 id="statExams">০</h3>
      <p>মোট পরীক্ষা</p>
    </div>
    <div class="dash-card">
      <div class="icon green"><i class="fa-solid fa-check-circle"></i></div>
      <h3 id="statPass">০</h3>
      <p>পাস</p>
    </div>
    <div class="dash-card">
      <div class="icon orange"><i class="fa-solid fa-star"></i></div>
      <h3 id="statGrade">—</h3>
      <p>সামগ্রিক গ্রেড</p>
    </div>
  </div>

  <div class="dash-section">
    <h3>📊 আমার রেজাল্ট</h3>
    <div id="resultArea" style="text-align:center;color:#64748b;padding:10px">
      লোড হচ্ছে...
    </div>
  </div>

  <div class="dash-section">
    <h3>📢 নোটিশ</h3>
    <ul id="noticeList">
      <li><span>লোড হচ্ছে...</span></li>
    </ul>
  </div>

  <div class="dash-section">
    <h3>👤 আমার তথ্য</h3>
    <ul id="myInfo">
      <li><span>আইডি</span> <span id="infoId">—</span></li>
      <li><span>শ্রেণি</span> <span id="infoClass">—</span></li>
      <li><span>বাচ</span> <span id="infoBatch">—</span></li>
      <li><span>মোবাইল</span> <span id="infoPhone">—</span></li>
    </ul>
  </div>
</div>

<!-- ============ FIREBASE ============ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs }
  from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBNwcshjGF5joK2bpzrTdxzNd5juOPwoaQ",
  authDomain: "dynamic-classroom.firebaseapp.com",
  projectId: "dynamic-classroom",
  storageBucket: "dynamic-classroom.firebasestorage.app",
  messagingSenderId: "911104617826",
  appId: "1:911104617826:web:935b512d66c8c89746103b",
  measurementId: "G-V0GSCD6EH4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db = db;
window.fbCollection = collection;
window.fbGetDocs = getDocs;

console.log("✅ Firebase connected (student)!");
</script>

<script>
/* ============ লগইন ============ */
async function studentLogin(e){
  e.preventDefault();
  var id   = document.getElementById("loginId").value.trim().toUpperCase();
  var pass = document.getElementById("loginPass").value.trim();
  var msg  = document.getElementById("msg");
  var btn  = document.getElementById("loginBtn");

  msg.className = "message";

  if(!id || !pass){
    msg.className = "message error";
    msg.textContent = "⚠️ আইডি ও পাসওয়ার্ড দুটোই দিন!";
    return false;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> খোঁজা হচ্ছে...';
  msg.className = "message info";
  msg.textContent = "⏳ Firebase-এ খোঁজা হচ্ছে...";

  try {
    var snap = await window.fbGetDocs(window.fbCollection(window.db, "Students"));

    if(snap.size === 0){
      msg.className = "message error";
      msg.textContent = "⚠️ এখনো কোনো শিক্ষার্থী যোগ করা হয়নি।";
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> লগইন করুন';
      return false;
    }

    var found = null;
    snap.forEach(function(doc){
      var data = doc.data();
      if(String(data.studentId || "").toUpperCase() === id){
        found = data;
      }
    });

    if(!found){
      msg.className = "message error";
      msg.textContent = "❌ এই আইডিতে কোনো শিক্ষার্থী নেই!";
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> লগইন করুন';
      return false;
    }

    if(String(found.password) !== pass){
      msg.className = "message error";
      msg.textContent = "❌ পাসওয়ার্ড ভুল!";
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> লগইন করুন';
      return false;
    }

    localStorage.setItem("dc_student_logged", "yes");
    localStorage.setItem("dc_student_id", found.studentId);
    localStorage.setItem("dc_student_name", found.name);
    localStorage.setItem("dc_student_class", found.className);
    localStorage.setItem("dc_student_batch", found.batch);
    localStorage.setItem("dc_student_phone", found.phone);

    msg.className = "message success";
    msg.textContent = "✅ লগইন সফল! ড্যাশবোর্ড লোড হচ্ছে...";

    setTimeout(function(){ showDashboard(); }, 700);

  } catch(err){
    msg.className = "message error";
    msg.textContent = "❌ সমস্যা: " + err.message;
    console.error(err);
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> লগইন করুন';
  return false;
}

/* ============ ড্যাশবোর্ড ============ */
async function showDashboard(){
  document.getElementById("loginContainer").style.display = "none";
  document.getElementById("dashboard").classList.add("active");

  var name  = localStorage.getItem("dc_student_name")  || "শিক্ষার্থী";
  var cls   = localStorage.getItem("dc_student_class") || "—";
  var batch = localStorage.getItem("dc_student_batch") || "—";
  var id    = localStorage.getItem("dc_student_id")    || "—";
  var phone = localStorage.getItem("dc_student_phone") || "—";

  document.getElementById("dashName").textContent = name;
  document.getElementById("dashInfo").textContent = "শ্রেণি: " + cls + " | বাচ: " + batch;
  document.getElementById("avatar").textContent   = name.charAt(0);

  document.getElementById("infoId").textContent    = id;
  document.getElementById("infoClass").textContent = cls;
  document.getElementById("infoBatch").textContent = batch;
  document.getElementById("infoPhone").textContent = phone;

  // নোটিশ লোড
  try {
    var snap = await window.fbGetDocs(window.fbCollection(window.db, "Notices"));
    var list = document.getElementById("noticeList");
    if(snap.size === 0){
      list.innerHTML = "<li><span>এখনো কোনো নোটিশ নেই</span></li>";
    } else {
      list.innerHTML = "";
      snap.forEach(function(doc){
        var n = doc.data();
        var li = document.createElement("li");
        li.innerHTML = "<span>" + (n.title || "নোটিশ") + "</span> <span class='badge " +
                       (n.type === 'জরুরি' ? 'pending' : '') + "'>" + (n.type || 'তথ্য') + "</span>";
        list.appendChild(li);
      });
    }
  } catch(err){
    document.getElementById("noticeList").innerHTML = "<li><span>নোটিশ লোড হয়নি</span></li>";
  }

  // রেজাল্ট লোড
  loadMyResults();
}

/* ============ রেজাল্ট ============ */
function gradeOf(marks, full){
  if(!full || full<=0) return 'F';
  var p=(marks/full)*100;
  if(p>=80)return 'A+';
  if(p>=70)return 'A';
  if(p>=60)return 'A-';
  if(p>=50)return 'B';
  if(p>=40)return 'C';
  if(p>=33)return 'D';
  return 'F';
}

async function loadMyResults(){
  var area=document.getElementById('resultArea');
  var myId=localStorage.getItem('dc_student_id');
  if(!myId){ area.innerHTML='<p>আইডি পাওয়া যায়নি</p>'; return; }

  try{
    var snap=await window.fbGetDocs(window.fbCollection(window.db,'Results'));
    var mine=[];
    snap.forEach(function(doc){
      var r=doc.data();
      if(String(r.studentId).toUpperCase()===String(myId).toUpperCase()){
        mine.push(r);
      }
    });

    if(mine.length===0){
      area.innerHTML='<p style="color:#999;padding:15px">এখনো কোনো রেজাল্ট যোগ করা হয়নি</p>';
      document.getElementById('statExams').textContent='০';
      document.getElementById('statPass').textContent='০';
      document.getElementById('statGrade').textContent='—';
      return;
    }

    // পরীক্ষা অনুযায়ী গ্রুপ
    var byExam={};
    var examOrder=['প্রথম মিডটার্ম','অর্ধ বার্ষিক','দ্বিতীয় মিডটার্ম','বার্ষিক পরীক্ষা',
                   'প্রথম টেস্ট','দ্বিতীয় টেস্ট','তৃতীয় টেস্ট','চতুর্থ টেস্ট','পঞ্চম টেস্ট',
                   'ষষ্ঠ টেস্ট','সপ্তম টেস্ট','অষ্টম টেস্ট','নবম টেস্ট','দশম টেস্ট'];

    mine.forEach(function(r){
      if(!byExam[r.exam]) byExam[r.exam]=[];
      byExam[r.exam].push(r);
    });

    // পরিসংখ্যান
    var totalExams=mine.length;
    var totalPass=0;
    mine.forEach(function(r){ if(r.status==='পাস') totalPass++; });

    var grandFull=0, grandGot=0;
    mine.forEach(function(r){ grandFull+=(r.full||0); grandGot+=(r.marks||0); });
    var overallGrade=gradeOf(grandGot, grandFull);

    document.getElementById('statExams').textContent=totalExams;
    document.getElementById('statPass').textContent=totalPass;
    document.getElementById('statGrade').textContent=overallGrade;

    // পরীক্ষাগুলো সাজানো
    var exams=Object.keys(byExam).sort(function(a,b){
      var ia=examOrder.indexOf(a), ib=examOrder.indexOf(b);
      if(ia===-1)ia=999;
      if(ib===-1)ib=999;
      return ia-ib;
    });

    var html='';
    exams.forEach(function(exam){
      var items=byExam[exam];
      var eFull=0, eGot=0;
      items.forEach(function(r){ eFull+=(r.full||0); eGot+=(r.marks||0); });
      var eGrade=gradeOf(eGot, eFull);
      var eGradeCls = eGrade==='F'?'mini-grade-fail':'mini-grade-pass';

      html+='<div class="exam-block">';
      html+='<div class="exam-head">';
      html+='<h4>📝 '+exam+'</h4>';
      html+='<div class="exam-total">মোট: <b style="color:#1a365d">'+eGot+'/'+eFull+'</b> <span class="mini-badge '+eGradeCls+'">'+eGrade+'</span></div>';
      html+='</div>';

      html+='<table class="exam-table">';
      html+='<thead><tr>'+
        '<th>বিষয়</th>'+
        '<th class="center">পূর্ণ</th>'+
        '<th class="center">পাস</th>'+
        '<th class="center">পেয়েছে</th>'+
        '<th class="center">গ্রেড</th>'+
        '<th class="center">ফলাফল</th>'+
      '</tr></thead><tbody>';

      items.forEach(function(r){
        var gc = r.grade==='F'?'mini-grade-fail':'mini-grade-pass';
        var sc = r.status==='পাস'?'mini-pass':'mini-fail';
        html+='<tr>'+
          '<td>'+r.subject+'</td>'+
          '<td class="center">'+r.full+'</td>'+
          '<td class="center">'+r.pass+'</td>'+
          '<td class="center"><b>'+r.marks+'</b></td>'+
          '<td class="center"><span class="mini-badge '+gc+'">'+r.grade+'</span></td>'+
          '<td class="center"><span class="mini-badge '+sc+'">'+r.status+'</span></td>'+
        '</tr>';
      });

      html+='</tbody></table></div>';
    });

    area.innerHTML=html;
    area.style.textAlign='left';
    area.style.padding='0';

  }catch(err){
    area.innerHTML='<p style="color:#ef4444">রেজাল্ট লোড হয়নি: '+err.message+'</p>';
    console.error(err);
  }
}

/* ============ লগআউট ============ */
function studentLogout(){
  if(!confirm("লগআউট করবেন?")) return;
  localStorage.removeItem("dc_student_logged");
  localStorage.removeItem("dc_student_id");
  localStorage.removeItem("dc_student_name");
  localStorage.removeItem("dc_student_class");
  localStorage.removeItem("dc_student_batch");
  localStorage.removeItem("dc_student_phone");
  location.reload();
}

window.addEventListener("DOMContentLoaded", function(){
  if(localStorage.getItem("dc_student_logged") === "yes"){
